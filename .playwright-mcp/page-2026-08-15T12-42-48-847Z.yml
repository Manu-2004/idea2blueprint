                    - generic [ref=f1e240]: "Deliverability: reminders landing in spam makes the product invisible. Mitigation — require domain verification at setup and show a send-health state."
                  - generic [ref=f1e241]:
                    - generic [ref=f1e242]: ·
                    - generic [ref=f1e243]: "Trust in automation: users may not let the tool send unsupervised. Mitigation — approval-required by default, auto-send as an opt-in after the first month."
                  - generic [ref=f1e244]:
                    - generic [ref=f1e245]: ·
                    - generic [ref=f1e246]: Stripe-only import limits the reachable market. Mitigation — CSV covers the rest at launch; measure how many use it.
                  - generic [ref=f1e247]:
