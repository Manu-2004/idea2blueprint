                - heading "Risks and assumptions" [level=3] [ref=f1e233]
              - paragraph [ref=f1e234]: The two risks that can end the product are deliverability and trust. Both need a check inside the eight weeks, not after.
              - generic [ref=f1e235]:
                - generic [ref=f1e236]: Risks
                - generic [ref=f1e237]:
                  - generic [ref=f1e238]:
