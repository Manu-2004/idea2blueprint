                - heading "Problem and target user" [level=3] [ref=e65]
              - paragraph [ref=e66]: "Solo designers and developers invoice a handful of clients a month and get paid late on a predictable share of them. Chasing is a social cost, not a technical one: the first reminder is easy, the second feels like begging, and the third never gets sent. The result is unpaid work carried for weeks and, on a small number of invoices, written off entirely."
