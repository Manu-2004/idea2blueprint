                - generic [ref=e206]:
                  - generic [ref=e207]:
                    - generic [ref=e208]: ·
                    - generic [ref=e209]: "Frontend: Next.js with TypeScript and Tailwind — one deployable, server actions for the small amount of backend work."
                  - generic [ref=e210]:
                    - generic [ref=e211]: ·
                    - generic [ref=e212]: "Backend and data: Supabase (Postgres, auth, row-level security). Tables: user, invoice, reminder, send_log."
                  - generic [ref=e213]:
                    - generic [ref=e214]: ·
                    - generic [ref=e215]: "Scheduling: a single cron job hitting one endpoint that queues the day's reminders. No queue system in the MVP."
                  - generic [ref=e216]:
                    - generic [ref=e217]: ·
                    - generic [ref=e218]: "Email: Resend, with domain authentication so reminders send from the freelancer's address."
                  - generic [ref=e219]:
                    - generic [ref=e220]: ·
                    - generic [ref=e221]: "Payments data: Stripe API for invoice read and paid webhooks."
                  - generic [ref=e222]:
                    - generic [ref=e223]: ·
