                - heading "Tech stack" [level=3] [ref=e202]
              - paragraph [ref=e203]: Chosen for one developer at a moderate comfort level shipping in eight weeks. Managed services over self-hosted, and no infrastructure the user has to think about.
              - generic [ref=e204]:
