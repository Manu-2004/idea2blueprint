                - heading "Risks and assumptions" [level=3] [ref=e234]
              - paragraph [ref=e235]: The two risks that can end the product are deliverability and trust. Both need a check inside the eight weeks, not after.
              - generic [ref=e236]:
                - generic [ref=e237]: Risks
                - generic [ref=e238]:
                  - generic [ref=e239]:
                    - generic [ref=e240]: ·
                    - generic [ref=e241]: "Deliverability: reminders landing in spam makes the product invisible. Mitigation — require domain verification at setup and show a send-health state."
                  - generic [ref=e242]:
                    - generic [ref=e243]: ·
                    - generic [ref=e244]: "Trust in automation: users may not let the tool send unsupervised. Mitigation — approval-required by default, auto-send as an opt-in after the first month."
                  - generic [ref=e245]:
                    - generic [ref=e246]: ·
                    - generic [ref=e247]: Stripe-only import limits the reachable market. Mitigation — CSV covers the rest at launch; measure how many use it.
                  - generic [ref=e248]:
                    - generic [ref=e249]: ·
                    - generic [ref=e250]: "Tone: a badly worded reminder damages a client relationship. Mitigation — conservative default copy, always previewable."
