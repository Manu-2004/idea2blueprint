[project]
name = "blueprint-agents"
version = "0.1.0"
description = "Idea2Blueprint agentic core: a LangGraph pipeline of Product/UX/Technical agents reviewed by a Spec Generator agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
blueprint-agents = "blueprint_agents.cli:main"
blueprint-agents-api = "blueprint_agents.api.serve:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
